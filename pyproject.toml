[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k-film"
version = "0.3.0"
description = "Shoot a Canon EOS 450D like a film camera: 100+ films, Fujifilm recipes, M-Film films and Darkrooms rolls"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Prakit Lawlertratana" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "pillow>=9.0", "rawpy>=0.18"]
keywords = ["k-film", "m-film", "canon", "450d", "rebel xsi", "film simulation", "raw", "photography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kfilm = "kfilm.cli:main"
xsi = "kfilm.cli:main"

[tool.setuptools]
packages = ["kfilm"]

[tool.setuptools.package-data]
kfilm = ["data/*.jpg"]
