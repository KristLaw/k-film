[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xsi-darkroom"
version = "0.1.0"
description = "Film-camera workflow and film simulation for the Canon EOS 450D / Rebel XSi"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Prakit Lawlertratana" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pillow>=9.0", "rawpy>=0.18"]
keywords = ["canon", "450d", "rebel xsi", "film simulation", "raw", "photography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
xsi = "xsi_darkroom.cli:main"

[tool.setuptools]
packages = ["xsi_darkroom"]
